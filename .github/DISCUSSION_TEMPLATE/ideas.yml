title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas are for discussing a problem and possible directions; they are not a development commitment.
        Once the goal, scope, and acceptance criteria are clear, maintainers may convert the discussion into an Issue.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you experiencing?
      description: Describe the current workflow, who is affected, and how often the problem occurs.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would you like?
      description: Describe the desired result without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
      description: Describe current workarounds, scripts, or manual processes and their limitations.
  - type: dropdown
    id: area
    attributes:
      label: Which area does this idea primarily affect?
      options:
        - Installation and upgrades
        - Certificate discovery
        - Configuration and credentials
        - Scheduled pull
        - Remote push
        - Platform or upstream integration
        - Documentation and community
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or validation information
      description: Include a sanitized scenario, configuration excerpt, or compatibility information when available.
  - type: checkboxes
    id: safety
    attributes:
      label: Before posting
      options:
        - label: I have searched existing Ideas and Issues.
          required: true
        - label: I have not included credentials, private keys, certificate contents, or customer information.
          required: true

