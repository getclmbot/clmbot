title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for asking. Search the documentation, Discussions, and Issues first.
        Do not include access keys, secrets, private keys, certificate contents, customer domains, internal addresses, or other sensitive data.
  - type: input
    id: goal
    attributes:
      label: What are you trying to accomplish?
      description: Describe the goal in one sentence, not only the error message.
      placeholder: For example, discover and automatically update an Nginx certificate on Linux amd64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: clmbot version
      placeholder: For example, v0.6.6
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, CPU architecture, web server, certificate format, and operating mode.
      placeholder: |
        - OS:
        - Architecture:
        - Web server:
        - Certificate format:
        - Mode:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and commands
      description: List the steps in order. Sanitize all configuration and log excerpts first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized logs
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you already tried?
      description: Include relevant documentation links and the result of each attempt.
  - type: checkboxes
    id: safety
    attributes:
      label: Before posting
      options:
        - label: I have searched the documentation, Discussions, and Issues.
          required: true
        - label: I have removed credentials, private keys, certificate contents, customer domains, internal addresses, and other sensitive data.
          required: true

