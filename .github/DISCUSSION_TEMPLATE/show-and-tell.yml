title: "[Show and tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share a real deployment and verified results so others can learn from it.
        Publish only information you are authorized to share, and sanitize it first.
  - type: input
    id: summary
    attributes:
      label: What did you complete?
      placeholder: For example, use scheduled pull to update certificates on two Nginx servers
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS / Architecture:
        - Web server or target:
        - Certificate source:
        - clmbot version:
        - Mode:
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: Explain the key steps, sanitized configuration, and why you chose this approach.
    validations:
      required: true
  - type: textarea
    id: lessons
    attributes:
      label: Lessons learned
      description: What was most likely to go wrong, and what advice would you give the next user?
    validations:
      required: true
  - type: textarea
    id: followup
    attributes:
      label: Next steps
      description: List remaining limitations, unverified items, or areas where community help would be useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-content confirmation
      options:
        - label: I am authorized to publish this content and have removed credentials, private keys, customer identifiers, internal addresses, and sensitive logs.
          required: true

