title: "[General] "
body:
  - type: markdown
    attributes:
      value: |
        Use General for introductions, use cases, and topics that do not fit another category.
        Use Q&A for support questions and Ideas for a specific improvement proposal.
  - type: input
    id: topic
    attributes:
      label: Discussion topic
      placeholder: Summarize the topic in one sentence
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Background and context
      description: Explain why you are raising this topic and how the community can participate.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What feedback are you looking for?
      description: Give participants a specific question that is easy to answer.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before posting
      options:
        - label: I have not included credentials, private keys, customer information, or other sensitive data.
          required: true

